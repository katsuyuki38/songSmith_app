<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SongSmith Vocal Studio</title><style>
:root{color-scheme:dark;--bg:#080b14;--p:#111827;--l:#334155;--t:#eef2ff;--m:#94a3b8;--a:#22d3ee;--b:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172554,transparent 28%),radial-gradient(circle at 85% 0,#3b0764,transparent 25%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif}.app{max-width:1450px;margin:auto;padding:16px}h1{margin:.2rem 0;font-size:clamp(28px,4vw,44px)}p{color:var(--m);margin:.25rem 0}.top,.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between;margin-bottom:14px}.bar,.panel{background:#0f172acc;border:1px solid #263248;border-radius:15px;box-shadow:0 18px 45px #0005}.bar{padding:10px;margin-bottom:12px}.btn,input,textarea,select{font:inherit}.btn{border:1px solid var(--l);background:#172033;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.btn.main{border:0;background:linear-gradient(135deg,#06b6d4,#8b5cf6);font-weight:800}.bar input,.bar select,.ctrl input,.ctrl textarea,.ctrl select{background:#0a1020;border:1px solid var(--l);color:#fff;border-radius:8px;padding:8px}.bar input{width:72px}.status{margin-left:auto;color:#c4b5fd;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}@media(max-width:950px){.layout{grid-template-columns:1fr}}.panel{overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid #263248;display:flex;justify-content:space-between;gap:10px}.head b{font-size:15px}.head span{font-size:11px;color:var(--m)}.scroll{overflow:auto;max-height:650px;background:#070b13;touch-action:none}.roll{display:grid;grid-template-columns:66px 1fr;min-width:1150px;user-select:none}.keys,.grid{position:relative}.keys{background:#0c1320;border-right:1px solid var(--l)}.key{position:absolute;left:0;right:0;padding:3px 5px;border-bottom:1px solid #1f2937;color:#64748b;font-size:10px}.key.black{background:#090e18}.grid{cursor:crosshair;background:#09101d;background-image:linear-gradient(to right,#1e293b 1px,transparent 1px),linear-gradient(to bottom,#1e293b 1px,transparent 1px)}.line{position:absolute;top:0;bottom:0;border-left:1px solid #33415555;pointer-events:none}.line.barline{border-left:2px solid #64748b66}.note{position:absolute;height:20px;border-radius:5px;background:linear-gradient(135deg,#0891b2,#22d3ee);border:1px solid #a5f3fc;color:#06202a;font-size:11px;font-weight:800;padding:2px 10px 2px 5px;overflow:hidden;white-space:nowrap;touch-action:none}.note.sel{background:linear-gradient(135deg,#7c3aed,#c084fc);border-color:#e9d5ff;color:#fff;z-index:4}.resize{position:absolute;right:0;top:0;bottom:0;width:8px;background:#fff3;cursor:ew-resize}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fb7185;box-shadow:0 0 8px #fb7185;z-index:9;display:none}.side{display:grid;gap:12px}.box{padding:13px}.box h2{font-size:15px;margin:0 0 10px}.ctrl{display:grid;gap:5px;margin:9px 0}.ctrl label{font-size:12px;color:#cbd5e1}.ctrl input,.ctrl textarea,.ctrl select{width:100%}.ctrl textarea{min-height:76px}.pair{display:grid;grid-template-columns:1fr 68px;gap:7px}.moras{display:flex;gap:5px;flex-wrap:wrap}.mora{font-size:12px;padding:4px 7px;border:1px solid var(--l);border-radius:6px;background:#111827}.mini{font-size:11px;color:#64748b}.hidden{display:none}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.meta div{text-align:center;background:#0a1020;border:1px solid #263248;border-radius:8px;padding:6px}.meta b{display:block}.meta small{color:#64748b}.footer{font-size:11px;color:#64748b;padding:12px 2px}
</style></head><body><div class="app">
<div class="top"><div><small style="color:#67e8f9;letter-spacing:.18em;font-weight:800">SONGSMITH / VOCAL ENGINE</small><h1>Vocal Studio</h1><p>日本語歌詞をモーラ分解し、子音先行・ピッチ・ビブラート・ダイナミクス・息成分をノート単位で調整する歌声合成MVP。</p></div><span class="mini">Web Audio / ブラウザ完結</span></div>
<div class="bar"><button class="btn main" id="play">▶ 再生</button><button class="btn" id="stop">■ 停止</button><button class="btn" id="demo">デモ</button><button class="btn" id="clear">全消去</button><label>BPM <input id="bpm" type="number" min="40" max="240" value="112"></label><label>量子化 <select id="q"><option value=".25">1/16</option><option value=".5">1/8</option><option value="1">1/4</option></select></label><button class="btn" id="save">保存</button><button class="btn" id="load">読込</button><button class="btn" id="wav">WAV</button><span class="status" id="status">準備完了</span></div>
<div class="layout"><section class="panel"><div class="head"><b>ピアノロール</b><span>空白: 追加 / ノート: 移動 / 右端: 長さ変更</span></div><div class="scroll"><div class="roll"><div class="keys" id="keys"></div><div class="grid" id="grid"><div class="playhead" id="ph"></div></div></div></div></section>
<aside class="side"><section class="panel box"><h2>歌詞</h2><div class="ctrl"><label>日本語歌詞</label><textarea id="lyrics">きっと きみを わすれない</textarea></div><button class="btn main" id="assign">モーラ分解して割り当て</button><div class="moras" id="moras"></div><p class="mini">拗音（きゃ等）は1モーラ、促音「っ」と撥音「ん」も個別に扱います。</p></section>
<section class="panel box"><h2>選択ノート調声</h2><div id="empty" class="mini">ノートを選択してください。</div><div id="ed" class="hidden"><div class="meta"><div><b id="nn">C4</b><small>NOTE</small></div><div><b id="nb">1.00</b><small>BEAT</small></div><div><b id="nd">1.00</b><small>LENGTH</small></div></div><div class="ctrl"><label>歌詞 / モーラ</label><input id="ly" maxlength="8"></div><div class="ctrl"><label>ピッチ (cent)</label><div class="pair"><input id="pitch" type="range" min="-100" max="100"><input id="pitchN" type="number" min="-100" max="100"></div></div><div class="ctrl"><label>子音先行 (ms)</label><div class="pair"><input id="cons" type="range" min="0" max="180"><input id="consN" type="number" min="0" max="180"></div></div><div class="ctrl"><label>ダイナミクス</label><div class="pair"><input id="dyn" type="range" min="20" max="120"><input id="dynN" type="number" min="20" max="120"></div></div><div class="ctrl"><label>ビブラート深さ (cent)</label><div class="pair"><input id="vib" type="range" min="0" max="80"><input id="vibN" type="number" min="0" max="80"></div></div><div class="ctrl"><label>ビブラート速さ (Hz)</label><div class="pair"><input id="vr" type="range" min="3" max="9" step=".1"><input id="vrN" type="number" min="3" max="9" step=".1"></div></div><div class="ctrl"><label>息成分</label><div class="pair"><input id="breath" type="range" min="0" max="100"><input id="breathN" type="number" min="0" max="100"></div></div><div class="ctrl"><label>しゃくり (cent)</label><div class="pair"><input id="scoop" type="range" min="-150" max="150"><input id="scoopN" type="number" min="-150" max="150"></div></div><button class="btn" id="del">選択ノート削除</button></div></section></aside></div><div class="footer">VOCALOID製品そのものではなく、歌唱入力と調声の考え方を独自実装したブラウザ歌声合成エンジンです。</div></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),RH=24,MIN=48,MAX=83,BEATS=32,PB=44,NM=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];let S={notes:[],sel:null,ctx:null,playing:false,timer:null,t0:0};const F={a:[800,1150,2900],i:[350,2100,3000],u:[400,900,2400],e:[500,1900,2600],o:[450,800,2830],n:[300,1200,2100]};const SV='ゃゅょぁぃぅぇぉャュョァィゥェォ',KM={あ:'a',か:'a',さ:'a',た:'a',な:'a',は:'a',ま:'a',や:'a',ら:'a',わ:'a',い:'i',き:'i',し:'i',ち:'i',に:'i',ひ:'i',み:'i',り:'i',う:'u',く:'u',す:'u',つ:'u',ぬ:'u',ふ:'u',む:'u',ゆ:'u',る:'u',え:'e',け:'e',せ:'e',て:'e',ね:'e',へ:'e',め:'e',れ:'e',お:'o',こ:'o',そ:'o',と:'o',の:'o',ほ:'o',も:'o',よ:'o',ろ:'o',を:'o',ん:'n'};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),snap=v=>{let q=+$('q').value;return Math.round(v/q)*q},name=m=>NM[m%12]+(Math.floor(m/12)-1),hz=(m,c=0)=>440*2**((m-69+c/100)/12),id=()=>Math.random().toString(36).slice(2,9);function vowel(x){if(!x)return'a';if(x==='ん'||x==='ン')return'n';let z=x.at(-1);if('ゃャぁァ'.includes(z))return'a';if('ゅュぅゥ'.includes(z))return'u';if('ょョぉォ'.includes(z))return'o';if('ぃィ'.includes(z))return'i';if('ぇェ'.includes(z))return'e';for(let c of [...x].reverse()){let h=c.charCodeAt(0);if(h>=0x30A1&&h<=0x30F6)c=String.fromCharCode(h-0x60);if(KM[c])return KM[c]}return'a'}function moras(t){let o=[];for(let c of [...t.replace(/[\s、。,.!！?？「」『』（）()・…ー]+/g,'')])SV.includes(c)&&o.length?o[o.length-1]+=c:o.push(c);return o}function note(m=60,s=0,d=1,l='あ'){return{id:id(),midi:m,start:s,dur:d,lyric:l,pitch:0,cons:55,dyn:85,vib:22,vr:5.4,breath:18,scoop:-35}}
function init(){let h=(MAX-MIN+1)*RH;$('keys').style.height=$('grid').style.height=h+'px';$('grid').style.width=BEATS*PB+'px';for(let m=MAX;m>=MIN;m--){let e=document.createElement('div');e.className='key '+([1,3,6,8,10].includes(m%12)?'black':'');e.style.top=(MAX-m)*RH+'px';e.style.height=RH+'px';e.textContent=name(m);$('keys').append(e)}for(let b=0;b<=BEATS;b++){let e=document.createElement('i');e.className='line '+(b%4===0?'barline':'');e.style.left=b*PB+'px';$('grid').append(e)}demo()}
function draw(){document.querySelectorAll('.note').forEach(e=>e.remove());for(let n of S.notes){let e=document.createElement('div');e.className='note'+(S.sel===n.id?' sel':'');e.dataset.id=n.id;e.style.left=n.start*PB+1+'px';e.style.top=(MAX-n.midi)*RH+2+'px';e.style.width=Math.max(12,n.dur*PB-2)+'px';e.textContent=n.lyric||name(n.midi);let r=document.createElement('span');r.className='resize';e.append(r);$('grid').append(e)}editor()}
function editor(){let n=S.notes.find(x=>x.id===S.sel);$('empty').classList.toggle('hidden',!!n);$('ed').classList.toggle('hidden',!n);if(!n)return;$('nn').textContent=name(n.midi);$('nb').textContent=(n.start+1).toFixed(2);$('nd').textContent=n.dur.toFixed(2);$('ly').value=n.lyric;for(let [a,k] of [['pitch','pitch'],['pitchN','pitch'],['cons','cons'],['consN','cons'],['dyn','dyn'],['dynN','dyn'],['vib','vib'],['vibN','vib'],['vr','vr'],['vrN','vr'],['breath','breath'],['breathN','breath'],['scoop','scoop'],['scoopN','scoop']])$(a).value=n[k]}
function setPair(a,b,k){let f=v=>{let n=S.notes.find(x=>x.id===S.sel);if(!n)return;n[k]=+v;$(a).value=$(b).value=v;editor()};$(a).oninput=e=>f(e.target.value);$(b).oninput=e=>f(e.target.value)}function showM(){let a=moras($('lyrics').value);$('moras').innerHTML='';for(let m of a){let e=document.createElement('span');e.className='mora';e.textContent=m;$('moras').append(e)}return a}
function noise(c,d){let b=c.createBuffer(1,Math.max(1,c.sampleRate*d|0),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);return b}function ctype(s){let c=(s||'')[0]||'';if('さしすせそざじずぜぞサシスセソザジズゼゾ'.includes(c))return's';if('はひふへほハヒフヘホ'.includes(c))return'h';if('かきくけこがぎぐげごカキクケコガギグゲゴ'.includes(c))return'k';if('たちつてとだぢづでどタチツテトダヂヅデド'.includes(c))return't';return''}
function voice(c,out,n,st,d){if(n.lyric==='っ'||n.lyric==='ッ')return;let fs=F[vowel(n.lyric)]||F.a,amp=clamp(n.dyn/100,.1,1)*.22,ce=Math.min(d*.45,n.cons/1000),en=st+d,g=c.createGain();g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(amp,st+.025);g.gain.setValueAtTime(amp,Math.max(st+.03,en-.06));g.gain.exponentialRampToValueAtTime(.0001,en);g.connect(out);let o=c.createOscillator(),base=hz(n.midi,n.pitch),sc=hz(n.midi,n.pitch+n.scoop);o.type='sawtooth';o.frequency.setValueAtTime(sc,st);o.frequency.exponentialRampToValueAtTime(base,st+Math.min(.1,d*.2));for(let i=0;i<3;i++){let f=c.createBiquadFilter(),v=c.createGain();f.type='bandpass';f.frequency.value=fs[i];f.Q.value=i?8:5;v.gain.value=[1,.55,.25][i];o.connect(f);f.connect(v);v.connect(g)}let l=c.createOscillator(),lg=c.createGain();l.frequency.value=n.vr;lg.gain.value=base*(2**(n.vib/1200)-1);l.connect(lg);lg.connect(o.frequency);let vs=st+Math.min(.2,d*.4);l.start(vs);l.stop(en);o.start(st);o.stop(en+.02);let br=c.createBufferSource(),bf=c.createBiquadFilter(),bg=c.createGain();br.buffer=noise(c,d);bf.type='highpass';bf.frequency.value=2500;bg.gain.value=n.breath/100*.06;br.connect(bf);bf.connect(bg);bg.connect(g);br.start(st);br.stop(en);let ct=ctype(n.lyric);if(ct&&ce){let ns=c.createBufferSource(),cf=c.createBiquadFilter(),cg=c.createGain(),cs=Math.max(0,st-ce);ns.buffer=noise(c,ce+.03);cf.type=ct==='s'?'bandpass':'highpass';cf.frequency.value=ct==='s'?5200:ct==='h'?2200:3000;cf.Q.value=ct==='s'?2:1;cg.gain.setValueAtTime(.0001,cs);cg.gain.linearRampToValueAtTime(.12,st-.005);cg.gain.exponentialRampToValueAtTime(.0001,st+.02);ns.connect(cf);cf.connect(cg);cg.connect(out);ns.start(cs);ns.stop(st+.03)}}
function endSec(){if(!S.notes.length)return 0;return Math.max(...S.notes.map(n=>n.start+n.dur))*60/(+$('bpm').value||120)+.5}async function play(){stop();if(!S.notes.length)return stat('ノートがありません');let C=window.AudioContext||window.webkitAudioContext,c=new C;S.ctx=c;await c.resume();let comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(c.destination);let spb=60/(+$('bpm').value||120),lead=.15,now=c.currentTime+lead;S.notes.forEach(n=>voice(c,comp,n,now+n.start*spb,n.dur*spb));S.playing=true;S.t0=performance.now()+lead*1000;$('ph').style.display='block';stat('再生中');anim();S.timer=setTimeout(stop,(endSec()+lead)*1000)}function anim(){if(!S.playing)return;let e=Math.max(0,(performance.now()-S.t0)/1000),b=e*(+$('bpm').value||120)/60;$('ph').style.left=b*PB+'px';requestAnimationFrame(anim)}function stop(){S.playing=false;if(S.timer)clearTimeout(S.timer);S.timer=null;if(S.ctx){try{S.ctx.close()}catch{}S.ctx=null}$('ph').style.display='none';stat('停止')}function stat(x){$('status').textContent=x}
function demo(){S.notes=[];let ms=moras('きっと きみを わすれない'),mel=[60,62,64,67,67,69,67,64,65,64,62,60,62,64,62,60],b=0;mel.forEach((m,i)=>{let d=i%4===3?1.5:.5,n=note(m,b,d,ms[i%ms.length]);n.vib=i%4===3?32:18;n.scoop=-30;n.cons=45+(i%4)*8;S.notes.push(n);b+=d});S.sel=S.notes[0].id;$('lyrics').value='きっと きみを わすれない';showM();draw();stat('デモ読み込み')}
function wavBuf(ab){let ch=ab.numberOfChannels,sr=ab.sampleRate,len=ab.length,buf=new ArrayBuffer(44+len*ch*2),v=new DataView(buf),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,buf.byteLength-8,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*ch*2,true);let o=44;for(let i=0;i<len;i++)for(let c=0;c<ch;c++){let x=clamp(ab.getChannelData(c)[i],-1,1);v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return buf}async function exportW(){if(!S.notes.length)return;stat('WAV作成中…');let sr=44100,d=endSec(),c=new OfflineAudioContext(1,Math.ceil(d*sr),sr),out=c.createDynamicsCompressor();out.connect(c.destination);let spb=60/(+$('bpm').value||120);S.notes.forEach(n=>voice(c,out,n,.15+n.start*spb,n.dur*spb));let b=await c.startRendering(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([wavBuf(b)],{type:'audio/wav'}));a.download='songsmith-vocal.wav';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);stat('WAV書き出し完了')}
$('grid').addEventListener('pointerdown',e=>{let el=e.target.closest('.note'),r=$('grid').getBoundingClientRect();if(!el){let s=clamp(snap((e.clientX-r.left)/PB),0,BEATS-.25),row=clamp(Math.floor((e.clientY-r.top)/RH),0,MAX-MIN),n=note(MAX-row,s,1,'あ');S.notes.push(n);S.sel=n.id;draw();return}e.preventDefault();S.sel=el.dataset.id;document.querySelectorAll('.note').forEach(x=>x.classList.toggle('sel',x===el));editor();let n=S.notes.find(x=>x.id===S.sel),sx=e.clientX,sy=e.clientY,os=n.start,om=n.midi,od=n.dur,resize=e.target.classList.contains('resize');el.setPointerCapture(e.pointerId);let move=v=>{if(resize)n.dur=clamp(snap(od+(v.clientX-sx)/PB),.25,BEATS-n.start);else{n.start=clamp(snap(os+(v.clientX-sx)/PB),0,BEATS-n.dur);n.midi=clamp(om-Math.round((v.clientY-sy)/RH),MIN,MAX)}el.style.left=n.start*PB+1+'px';el.style.top=(MAX-n.midi)*RH+2+'px';el.style.width=Math.max(12,n.dur*PB-2)+'px';editor()},up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);draw()};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
$('play').onclick=play;$('stop').onclick=stop;$('demo').onclick=demo;$('clear').onclick=()=>{stop();S.notes=[];S.sel=null;draw()};$('assign').onclick=()=>{let a=showM(),ns=[...S.notes].sort((x,y)=>x.start-y.start);if(a.length)ns.forEach((n,i)=>n.lyric=a[i%a.length]);draw()};$('lyrics').oninput=showM;$('ly').oninput=e=>{let n=S.notes.find(x=>x.id===S.sel);if(n){n.lyric=e.target.value;draw()}};$('del').onclick=()=>{S.notes=S.notes.filter(n=>n.id!==S.sel);S.sel=null;draw()};$('save').onclick=()=>{localStorage.setItem('songsmith-vocal-v2',JSON.stringify({bpm:+$('bpm').value,lyrics:$('lyrics').value,notes:S.notes}));stat('保存しました')};$('load').onclick=()=>{try{let p=JSON.parse(localStorage.getItem('songsmith-vocal-v2'));$('bpm').value=p.bpm;$('lyrics').value=p.lyrics;S.notes=p.notes;S.sel=S.notes[0]?.id||null;showM();draw();stat('読み込みました')}catch{stat('保存データなし')}};$('wav').onclick=exportW;for(let [a,b,k] of [['pitch','pitchN','pitch'],['cons','consN','cons'],['dyn','dynN','dyn'],['vib','vibN','vib'],['vr','vrN','vr'],['breath','breathN','breath'],['scoop','scoopN','scoop']])setPair(a,b,k);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();S.playing?stop():play()}});init()})();
</script></body></html>
